{% extends "base.html" %}

{% block title %}支付结果确认中 - 天天生鲜{% endblock %}

{% block content %}
<div class="card form-box" style="width:560px">
    <h2>支付结果确认中</h2>
    <p>订单号：{{ order.order_id }}</p>
    <p>应付总额：<strong style="color:#e4393c">¥{{ order.total_pay }}</strong></p>
    <p id="pay-status" class="msg msg-info">正在向支付平台确认结果，请稍候...</p>

    <p style="margin-top:18px">
        <a class="btn" href="{% url 'order:list' %}">返回订单列表</a>
        {% if order.is_unpaid %}
            <a class="btn btn-primary" href="{% url 'order:pay' order.order_id %}">重新支付</a>
        {% endif %}
    </p>
</div>

<script>
    (function () {
        var statusBox = document.getElementById("pay-status");
        var pollUrl = "{{ poll_url }}";
        var interval = {{ poll_interval|default:2 }} * 1000;
        var attempts = 0;

        function poll() {
            attempts += 1;
            fetch(pollUrl, {headers: {"Accept": "application/json"}})
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    if (data.pay_status === 1) {
                        statusBox.textContent = "支付成功，正在跳转...";
                        window.location.href = data.redirect_url;
                        return;
                    }
                    if (data.pay_status === 2) {
                        statusBox.textContent = "订单已取消，正在跳转...";
                        window.location.href = data.redirect_url;
                        return;
                    }
                    statusBox.textContent = "支付结果确认中，请稍候...（" + attempts + "）";
                    if (attempts >= 30) {
                        statusBox.textContent = "暂未确认支付结果，请稍后在订单列表查看。";
                        return;
                    }
                    window.setTimeout(poll, interval);
                })
                .catch(function () {
                    statusBox.textContent = "网络异常，正在重试...";
                    if (attempts < 30) {
                        window.setTimeout(poll, interval);
                    }
                });
        }

        window.setTimeout(poll, interval);
    })();
</script>
{% endblock %}
