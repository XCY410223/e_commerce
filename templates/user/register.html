{% extends "base.html" %}

{% block title %}注册 - 天天生鲜{% endblock %}

{% block content %}
<div class="card form-box">
    <h2>用户注册</h2>

    {% if error %}<div class="msg msg-error">{{ error }}</div>{% endif %}

    <form method="post" action="{% url 'user:register' %}">
        {% csrf_token %}
        {% if ref %}<input type="hidden" name="ref" value="{{ ref }}">{% endif %}
        {% if ref %}<div class="msg msg-success">已通过好友邀请注册，完成首单后好友可获得奖励券。</div>{% endif %}
        <div class="field">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" value="{{ username|default:'' }}" required autofocus>
        </div>
        <div class="field">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" value="{{ email|default:'' }}" placeholder="用于接收激活邮件" required>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="field">
            <label for="password2">确认密码</label>
            <input type="password" id="password2" name="password2" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">立即注册</button>
        </div>
    </form>

    <p class="form-foot">已有账号？<a href="{% url 'user:login' %}">直接登录</a></p>
</div>
{% endblock %}
