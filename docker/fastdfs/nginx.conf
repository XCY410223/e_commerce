user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 100m;

    upstream fastdfs_storage {
        server fastdfs-storage:8888;
    }

    upstream fastdfs_uploader {
        server fastdfs-uploader:8889;
    }

    server {
        listen 8888;
        server_name _;

        location = /healthz {
            proxy_pass http://fastdfs_uploader/healthz;
            access_log off;
        }

        location ~ ^/group[0-9]+/ {
            proxy_pass http://fastdfs_storage;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /api/upload {
            proxy_pass http://fastdfs_uploader/upload;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-FastDFS-Token $http_x_fastdfs_token;
        }

        location = /api/delete {
            proxy_pass http://fastdfs_uploader/delete;
            proxy_read_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-FastDFS-Token $http_x_fastdfs_token;
        }

        location / {
            return 404;
        }
    }
}
